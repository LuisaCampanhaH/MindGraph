<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MindGraph</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <!-- Toolbar -->
  <div class="panel toolbar-panel">
    <span style="font-weight:600;font-size:14px;color:#333">🧠 MindGraph</span>
    <div class="toolbar-actions">
      <label class="toggle-label">
        <input type="checkbox" id="directed-toggle" />
        Directed edges
      </label>
      <button id="save-btn">Save session</button>
      <button id="load-btn">Load session</button>
      <button id="export-json-btn">Export JSON</button>
      <button id="import-json-btn">Import JSON</button>
      <button id="export-png-btn">Export PNG</button>
    </div>
    <input type="file" id="import-file-input" accept=".json" style="display:none" />
  </div>

  <!-- Fase 1 -->
  <div class="panel" id="phase1-panel">
    <h2>Phase 1 — Define groups</h2>
    <div id="phase1-form">
      <div class="field-group">
        <label>Ceiling <span style="color:#bbb;font-weight:400;text-transform:none">(comma-separated)</span></label>
        <input type="text" id="input-teto" placeholder="e.g. diabetes, insulin" />
      </div>
      <div class="field-group">
        <label>Floor <span style="color:#bbb;font-weight:400;text-transform:none">(comma-separated)</span></label>
        <input type="text" id="input-piso" placeholder="e.g. sugar, glucose" />
      </div>
      <div class="field-group">
        <label>Related <span style="color:#bbb;font-weight:400;text-transform:none">(optional, comma-separated)</span></label>
        <input type="text" id="input-rel" placeholder="e.g. diet, exercise" />
      </div>
    </div>
    <div id="form-actions">
      <button id="start-btn">Generate graph →</button>
      <button id="reset-btn">Clear all</button>
    </div>
  </div>

  <!-- Fase 2 -->
  <div class="panel" id="phase2-panel">
    <h2>Phase 2 — Build connections</h2>
    <div id="pair-status">
      <span id="pair-counter">Pair 1 of 6</span>
      <div id="progress-bar-wrap"><div id="progress-bar" style="width:0%"></div></div>
    </div>
    <div id="pair-prompt">
      <span class="pair-node" id="node-a-label">A</span>
      <span class="pair-arrow">↔</span>
      <span class="pair-node" id="node-b-label">B</span>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <input type="text" id="input-meio" placeholder="Connecting concept (Enter to confirm)" style="flex:1" />
    </div>
    <div id="phase2-actions">
      <button id="confirm-btn">Confirm</button>
      <button id="skip-btn">Skip →</button>
      <button id="reset-btn2" style="margin-left:auto">← Restart</button>
    </div>
    <div id="done-msg" style="margin-top:10px;display:none;align-items:center;gap:10px">
      <span style="color:#0F6E56;font-weight:500">✓ Round <span id="round-num">1</span> done!</span>
      <button id="next-round-btn" style="background:#0F6E56;color:#fff;border-color:#0F6E56">Next round →</button>
      <span id="no-pairs-msg" style="display:none;color:#999;font-size:13px">No new pairs — graph complete!</span>
    </div>
  </div>

  <!-- Grafo -->
  <div id="canvas-wrap">
    <canvas id="graph-canvas"></canvas>
  </div>
  <div id="hint">💡 Drag nodes to move · Click to select · Double-click to rename · Delete removes selected</div>

</div>
<script src="script.js"></script>
</body>
</html>
